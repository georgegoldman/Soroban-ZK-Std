[package]
name = "soroban-zk-std"
version = "0.1.4"
edition = "2021"
rust-version = "1.100.0"
authors = ["Neslabs", "Soroban-ZK-Std Contributors"]
description = "A high-performance cryptographic standard library for Stellar Protocol 25 ZK-Primitives."
homepage = "https://github.com/georgegoldman/Soroban-ZK-Std"
documentation = "https://docs.rs/soroban-zk-std"
repository = "https://github.com/georgegoldman/Soroban-ZK-Std"
readme = "README.md"
keywords = ["stellar", "soroban", "zk", "cryptography", "zero-knowledge"]
categories = ["cryptography", "no-std", "wasm"]
include = ["src/**", "tests/**", "benches/**", "Cargo.toml", "README.md"]
license.workspace = true

# `cdylib` produces the compiled `wasm32v1-none` guest binary that
# `tests/wasm_zk_contract_e2e.rs` loads into the Soroban host, so the reference
# `ZkContract` entry points can be tested as deployed bytecode, not just as
# natively-registered Rust.
[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["contract", "macros"]
# Exports the reference `ZkContract` entry points. Disable (default-features = false)
# in contracts that only consume the library, to keep their WASM under 64 KB.
contract = []
std = ["soroban-sdk/hazmat-crypto"] # or however you want to name it
# Use the pure-software (arkworks) pairing check instead of the native
# CAP-0075 host function. Enable this for environments without the Soroban host.
software-fallback = []
# `include_snarkjs_vk!`, `snarkjs_vk!` and `#[zk_verifier]` (Issue #567).
macros = ["dep:soroban-zk-macros"]

[[bin]]
name = "gen_vectors"
path = "src/bin.rs"
required-features = ["std"]  # Only builds when "std" feature is enabled


[dependencies]
# Inherited from workspace (no_std enabled)
soroban-sdk = { workspace = true, features = ["hazmat-crypto", "alloc"]}
ethnum = { workspace = true }
soroban-zk-core = { workspace = true }
soroban-zk-macros = { workspace = true, optional = true }

# Math & Crypto (Strictly no_std)


ark-bn254 = { version = "0.6.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
num-bigint = { version = "0.5.1", default-features = false }

[dev-dependencies]
proptest = "1"
sha2 = "0.11"
ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-snark = "0.6.0"
ark-ff = "0.6.0"
ark-std = "0.6.0"
soroban-sdk = { workspace = true, features = ["testutils"] }

[[bench]]
name = "instruction_cost"

[lints]
workspace = true
