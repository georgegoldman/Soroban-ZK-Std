ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-snark = "0.6.0"
ark-std = "0.6.0"

[lints]
workspace = true
