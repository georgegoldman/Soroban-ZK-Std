name: Security & Malware Scan

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polinrider-scan:
    name: 🛡️ PolinRider & Supply-Chain Payload Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR tree (no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The scanner is taken from the BASE branch, not from the PR, so a PR
      # cannot weaken or disable the scanner that is checking it.
      - name: Checkout trusted scanner from base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          sparse-checkout: scripts
          persist-credentials: false

      - name: Verify Scanner Self-Tests (trusted copy)
        run: python3 .trusted/scripts/check-malware.py --self-test

      - name: Scan PR Tree for Hidden Payloads & Dropper Files (trusted scanner)
        run: python3 .trusted/scripts/check-malware.py --root "$GITHUB_WORKSPACE"

      - name: Flag build / dependency / CI file changes for review (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f .trusted/scripts/flag-build-changes.py ]; then
            python3 .trusted/scripts/flag-build-changes.py --self-test
            python3 .trusted/scripts/flag-build-changes.py --base "$BASE_SHA"
          else
            echo "flag-build-changes.py not present on the base branch yet; skipping."
          fi
