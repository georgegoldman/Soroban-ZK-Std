name: Contributor Guard

# Metadata + diff-text checks only. Uses `pull_request` (read-only token on forks)
# and NEVER executes code from the PR; PR fields are passed through env vars and
# are never interpolated into shell commands.
on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  guard:
    name: 🚧 PR Title, Issue Link & File Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, no credentials persisted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard self-tests
        run: python3 scripts/contributor-guard.py --self-test

      - name: Run contributor guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # Used only to waive the issue-link rule for Dependabot's machine-written bodies.
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          # HEAD is the PR merge commit; HEAD^1 is the current base-branch tip (the true
          # merge base). pull_request.base.sha is frozen at PR open and would blame the
          # author for everything that landed on main since.
          BASE_SHA="$(git rev-parse HEAD^1)"
          python3 scripts/contributor-guard.py --base "$BASE_SHA"
