name: Soroban ZK Standard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  security-gate:
    name: 🛡️ Pre-Build Malware Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Scanner comes from the BASE branch so a PR cannot weaken it.
      - name: Checkout trusted scanner from base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          path: .trusted
          sparse-checkout: scripts
          persist-credentials: false

      - name: Scan for PolinRider & hidden payloads before any build step
        run: python3 .trusted/scripts/check-malware.py --root "$GITHUB_WORKSPACE"

  format-gate:
    name: 🎨 Format Gate (rustfmt)
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Pinned Rust Toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt

      - name: Check formatting
        run: |
          set +e
          cargo fmt --all -- --check > fmt.diff 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            cat fmt.diff
            while IFS= read -r line; do
              case "$line" in
                "Diff in "*)
                  loc="${line#Diff in }"
                  loc="${loc#"$PWD/"}"
                  file="${loc%%:*}"
                  rest="${loc#*:}"
                  lineno="${rest%%:*}"
                  if [ -n "$file" ] && [ -n "$lineno" ]; then
                    echo "::error file=${file},line=${lineno}::Unformatted Rust code. Run 'cargo fmt --all' locally and commit."
                  fi
                  ;;
              esac
            done < fmt.diff
            {
              echo '### ❌ Formatting check failed (`cargo fmt --all -- --check`)'
              echo
              echo 'Run `cargo fmt --all` locally, commit, and push.'
              echo
              echo '````diff'
              head -c 60000 fmt.diff
              echo
              echo '````'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  verify-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    needs: [security-gate, format-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 🚨 Enforce Formatting
        run: cargo fmt --all -- --check

      - name: 🔍 Strict Linting
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Run Tests
        run: cargo test --release

      - name: 🔨 Build WASM (verifier-sample contract)
        run: cargo build --target wasm32v1-none --release -p verifier-sample

      - name: 🛡️ Audit Dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2

  halo2-primitives:
    name: 🧩 Halo2 Verifier Primitives
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-halo2-${{ hashFiles('**/Cargo.lock') }}

      # Exercises the no_std Halo2 verifier primitives in soroban-zk-core
      # (custom-gate evaluation loop, permutation grand-product argument, and the
      # recursion/accumulation state) without depending on the higher-level
      # soroban-zk-std verifier crate.
      - name: 🧪 Run Halo2 primitive tests
        run: cargo test -p soroban-zk-core --lib halo2

  miri-check:
    name: 🔬 Memory Safety (Miri)
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Nightly Rust + Miri
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Disable vendoring for Miri
        run: rm -f .cargo/config.toml

      - name: 🧪 Run Miri on soroban-zk-core library
        run: cargo +nightly miri test -p soroban-zk-core --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

      - name: 🧪 Run native integration tests
        run: cargo +nightly test -p soroban-zk-core --test eip196_vectors

  wasm-size-check:
    name: 📦 WASM 64KB Limit Check
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Build verifier-sample Contract WASM
        run: cargo build --release --target wasm32v1-none -p verifier-sample

      - name: Check WASM Size
        run: |
          WASM_FILE="target/wasm32v1-none/release/verifier_sample.wasm"

          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ Error: verifier_sample.wasm not found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$WASM_FILE")
          MAX_SIZE=65536

          echo "WASM size: $SIZE bytes / $MAX_SIZE bytes max"

          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "❌ CRITICAL: WASM exceeds 64KB limit ($SIZE bytes)"
            exit 1
          else
            echo "✅ SUCCESS: $SIZE bytes — within limit"
          fi

  frontend-audit:
    name: 🛡️ Frontend Dependency Audit (informational)
    runs-on: ubuntu-latest
    needs: [security-gate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v3
        with:
          version: 9

      # Informational: reports vulnerabilities as a warning annotation instead of
      # failing every PR. Make it blocking by removing the `||` fallback.
      - name: Audit production dependencies (no install scripts are run)
        working-directory: frontend
        run: |
          pnpm audit --prod || echo "::warning title=pnpm audit::Vulnerable frontend dependencies found. Run 'pnpm audit --prod' in frontend/ for details."
