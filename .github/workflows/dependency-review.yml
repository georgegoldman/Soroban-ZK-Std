name: Dependency Review

# Diffs the dependency manifests/lockfiles (Cargo.lock, pnpm-lock.yaml, ...) of a
# PR and fails on known-vulnerable or malicious packages. Requires the
# "Dependency graph" to be enabled in repo settings.
on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  dependency-review:
    name: 📦 Dependency Review
    runs-on: ubuntu-latest
    # Non-blocking until the repo's "Dependency graph" setting is enabled (the
    # action errors when it is off). Remove this line once it is enabled.
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
