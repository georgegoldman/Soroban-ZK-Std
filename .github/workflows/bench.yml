name: Benchmarks

# Criterion performance-regression tracking (see BENCHMARKS.md →
# "CI Regression Tracking").
#
#   main : runs the Criterion suites and stores the raw estimates as the
#          `criterion-baseline` artifact.
#   PRs  : re-runs the same suites with the same runner label, compiler and
#          sampling settings, compares each benchmark's mean wall clock against
#          the most recent main baseline, publishes a table to the job summary
#          and fails when any benchmark is slower than the threshold (10 % by
#          default).
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
      - "scripts/bench-regression.py"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
      - "scripts/bench-regression.py"
  workflow_dispatch:
    inputs:
      max_regression_pct:
        description: "Fail when a benchmark is slower than the baseline by more than this percentage."
        required: false
        default: "10"
        type: string

env:
  CARGO_TERM_COLOR: always
  # Configurable gate. Override without editing this file by setting the
  # repository variable BENCH_MAX_REGRESSION_PCT (Settings → Secrets and
  # variables → Actions → Variables) or the dispatch input above.
  BENCH_MAX_REGRESSION_PCT: ${{ github.event.inputs.max_regression_pct || vars.BENCH_MAX_REGRESSION_PCT || '10' }}
  # Identical sampling on main and PRs: more samples than the default run and a
  # longer measurement window keep run-to-run noise below the 10 % gate.
  BENCH_ARGS: "--sample-size 100 --warm-up-time 3 --measurement-time 10"
  BENCH_TARGETS: "-p soroban-zk-core --all-features --bench g1_ops --bench montgomery_ops --bench bulletproofs_vs_groth16"

permissions:
  contents: read

# Never let two benchmark jobs share a cache/target directory, and never let
# main/PR runs interleave: they are the source of the stored baseline.
concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: 📈 Record main baseline
    if: github.event_name != 'pull_request'
    # Runner label is pinned: wall-clock numbers are only comparable on the same
    # hardware and image. Point BENCH_RUNNER at a dedicated runner to keep the
    # baseline stable across GitHub runner image updates.
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: 🧪 Self-test comparison script
        run: python3 scripts/bench-regression.py --self-test

      - name: 🏁 Run Criterion benchmarks
        run: cargo bench $BENCH_TARGETS -- $BENCH_ARGS

      - name: ⛽ Instruction-budget benches
        run: cargo bench -p soroban-zk-std --bench instruction_cost -- --nocapture

      - name: 📦 Stage baseline JSON
        run: |
          set -euo pipefail
          rm -rf bench-results
          mkdir -p bench-results
          cd target/criterion
          find . -path '*/new/estimates.json' -print0 \
            | xargs -0 -r -I{} cp --parents {} "$GITHUB_WORKSPACE/bench-results/"
          count=$(find "$GITHUB_WORKSPACE/bench-results" -name estimates.json | wc -l)
          echo "Staged $count benchmark estimate(s)."
          if [ "$count" -eq 0 ]; then
            echo "❌ No Criterion estimates were produced."
            exit 1
          fi

      - name: 💾 Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline
          path: bench-results
          if-no-files-found: error
          retention-days: 90

  regression:
    name: 📉 Criterion Regression Check
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # read the baseline artifact from the last main run
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: 🧪 Self-test comparison script
        run: python3 scripts/bench-regression.py --self-test

      - name: 🔎 Download latest main baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf bench-baseline
          mkdir -p bench-baseline
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/bench.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].database_id // empty' || true)
          if [ -z "$run_id" ]; then
            echo "No successful main benchmark run found — comparison will be skipped."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh run download "$run_id" --name criterion-baseline --dir bench-baseline; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Baseline artifact unavailable — comparison will be skipped."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏁 Run Criterion benchmarks
        run: cargo bench $BENCH_TARGETS -- $BENCH_ARGS

      - name: ⛽ Instruction-budget benches
        run: cargo bench -p soroban-zk-std --bench instruction_cost -- --nocapture

      - name: 📊 Compare against main baseline
        run: |
          set -euo pipefail
          python3 scripts/bench-regression.py \
            --baseline bench-baseline \
            --current target/criterion \
            --threshold "$BENCH_MAX_REGRESSION_PCT" \
            --summary bench-summary.md

      - name: 📝 Publish job summary
        if: always()
        run: |
          if [ -f bench-summary.md ]; then
            cat bench-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
