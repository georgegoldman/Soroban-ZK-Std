name: Rust Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: soroban-zk-core line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain with LLVM tools
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage and enforce minimum
        run: cargo llvm-cov --package soroban-zk-core --fail-under-lines 40

      - name: Write per-file coverage summary
        if: always()
        run: |
          {
            echo "## soroban-zk-core line coverage"
            echo
            echo '```text'
            cargo llvm-cov report --package soroban-zk-core || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export LCOV
        if: always()
        run: cargo llvm-cov report --package soroban-zk-core --lcov --output-path lcov.info

      - name: Export HTML report
        if: always()
        run: cargo llvm-cov report --package soroban-zk-core --html --output-dir coverage-html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soroban-zk-core-coverage
          path: |
            lcov.info
            coverage-html/
          if-no-files-found: warn
