name: Fuzz (nightly smoke)

on:
  schedule:
    # Nightly smoke run. Keep each target short so the job stays cheap; deeper
    # runs can be started manually with a larger `seconds` value.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "60"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '60' }}

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - groth16_proof_bytes
          - groth16_vk_bytes
          - plonk_proof_bytes
          - bulletproof_bytes
          - xdr_decode
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry and fuzz build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }}
        id: run
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          RUST_BACKTRACE: "1"
        run: |
          cargo fuzz run "$TARGET" "corpus/$TARGET" -- \
            -max_total_time="${SECONDS_PER_TARGET}" \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
