name: Fuzz

# Nightly/manual coverage-guided smoke run for the proof, VK and XDR parsers.
# The fuzz crate is intentionally excluded from the root workspace, so this is
# the only workflow that builds libFuzzer targets. A crash fails the job and
# uploads the minimized input for triage (see CONTRIBUTING.md §8).
on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "60"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: 🧪 ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - groth16_proof_bytes
          - groth16_vk_bytes
          - plonk_proof_bytes
          - bulletproof_bytes
          - xdr_decode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly

      - name: Cache cargo and fuzz build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '60' }} \
            -rss_limit_mb=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
