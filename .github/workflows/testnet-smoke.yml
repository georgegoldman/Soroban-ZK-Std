name: Testnet Smoke (verifier-sample)

# Manual only: deploys contracts/verifier-sample to Stellar testnet with a
# throwaway, Friendbot-funded key and runs scripts/deploy_testnet.sh.
# No repository secrets are used, and the token is read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned stellar-cli release and the sha256 of its x86_64 Linux tarball
  # (from the release's published asset digest). Bump both together.
  STELLAR_CLI_VERSION: "30.0.1"
  STELLAR_CLI_SHA256: "48c70074020e09af0a3ebbd2bf62d53c9aec47935e49a112d3cd90fb4e37658f"

jobs:
  security-gate:
    name: 🛡️ Pre-Build Malware Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scanner comes from the default branch so the dispatched ref cannot weaken it.
      - name: Checkout trusted scanner from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          sparse-checkout: scripts
          persist-credentials: false

      - name: Scan for PolinRider & hidden payloads before any build step
        run: python3 .trusted/scripts/check-malware.py --root "$GITHUB_WORKSPACE"

  testnet-smoke:
    name: 🚀 Deploy & Smoke-Test on Testnet
    runs-on: ubuntu-latest
    needs: [security-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-testnet-${{ hashFiles('**/Cargo.lock') }}

      # Prebuilt, checksum-verified binary: no `cargo install`, no package
      # manager install scripts run.
      - name: Install stellar-cli (pinned, sha256-verified)
        run: |
          set -euo pipefail
          tarball="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${tarball}"
          echo "${STELLAR_CLI_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/stellar-cli" stellar
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"

      - name: Lint script (shellcheck) and dry run
        run: |
          shellcheck scripts/deploy_testnet.sh
          bash scripts/deploy_testnet.sh --dry-run

      - name: Deploy to testnet and run smoke checks
        run: bash scripts/deploy_testnet.sh
