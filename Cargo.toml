
[workspace]
resolver = "2"
members = [
    "crates/*",
    "contracts/*",
    "hackathon-demo/contracts/*",
]

[workspace.package]
license = "Apache-2.0"

# Issue #536 — cfg names/values that are set outside of Cargo (e.g. `--cfg kani`
# from the kani harness runner) or that are not Cargo features. Members opt in
# with `[lints] workspace = true`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(feature, values("alloc"))'] }

[workspace.dependencies]
soroban-sdk = { version = "27.0.2", default-features = false } # Standard for 2026 Protocol 25
ethnum = { version = "1.5.3", default-features = false }
soroban-zk-core = { version = "0.1.0", path = "./crates/soroban-zk-core" }
soroban-zk-std = { version = "0.1.4", path = "./crates/soroban-zk-std" }

[patch."https://github.com/rust-num/num-traits"]
num-traits = { version = "0.2.19" }


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
